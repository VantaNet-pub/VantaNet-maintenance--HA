name: VantaNet Maintenance
version: "1.3.2"
slug: vantanet_maintenance
description: Halbjährliche Wartung, Tablet-Steuerung und Fachkraft-PIN
url: https://vantanet.net
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
map:
  - homeassistant_config:ro
ingress: true
ingress_port: 8099
panel_icon: mdi:tools
panel_title: VantaNet Wartung
ports:
  8099/tcp: 8765
ports_description:
  8099/tcp: Lokaler Zugriff auf Display-Seiten (nicht ins Internet freigeben)
options:
  site_location: ""
  maintenance_lock_entity: ""
  kiosk_password: ""
  tablet_ips:
    - "192.168.178.XX"
  home_assistant_url: "http://192.168.178.XX:8123"
  dashboard_path: "/lovelace/0"
  public_base_url: "http://192.168.178.XX:8765"
  first_maintenance_due: ""
schema:
  site_location: str
  maintenance_lock_entity: str?
  kiosk_password: str
  tablet_ips:
    - str
  home_assistant_url: url
  dashboard_path: str
  public_base_url: url
  first_maintenance_due: str?
